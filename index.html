<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle" for="theme-toggle-input">
        <input type="checkbox" id="theme-toggle-input" aria-pressed="false" aria-label="Cambiar a modo claro" />
        <span class="theme-toggle-slider"></span>
        <span class="theme-toggle-text">LIGHT</span>
      </label>
    </div>
    <div id="start-screen" class="start-screen">
      <h2 class="start-screen-title">TETRIS</h2>
      <table class="records-table">
        <thead>
          <tr><th>Nombre</th><th>Puntuación</th><th>Líneas</th><th>Nivel</th></tr>
        </thead>
        <tbody id="start-records-body"></tbody>
      </table>
      <p id="start-best-stats" class="best-stats"></p>
      <div class="start-screen-actions">
        <button id="play-btn">JUGAR</button>
        <button id="clear-records-btn" class="secondary-btn">Borrar records</button>
      </div>
    </div>

    <div class="game-container hidden">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="overlay-records" class="overlay-records">
          <table class="records-table">
            <thead>
              <tr><th>Nombre</th><th>Puntuación</th><th>Líneas</th><th>Nivel</th></tr>
            </thead>
            <tbody id="overlay-records-body"></tbody>
          </table>
          <p id="overlay-best-stats" class="best-stats"></p>
          <div id="name-entry" class="name-entry hidden">
            <input type="text" id="player-name-input" maxlength="12" value="ANON" autofocus />
            <button id="save-record-btn">Guardar</button>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
